<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside the Cell City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 3D walk through the cell, from food to glucose, glycolysis, the Krebs cycle and ATP, plus a to-scale tour of red and white blood cells.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage (a fluorescence-microscope view) beside a chapter panel; on phones the panel stacks under the stage.
   Deliberately single-theme: the stage is a dark microscope field, so the whole page commits to it. */
:root {
  --bg: #060a11;
  --bg-2: #0b111b;
  --surface: #111a27;
  --line: #1d2939;
  --fg: #e6edf5;
  --muted: #8c9bb0;
  --accent: #4fd6e8;

  /* molecule colours, shared with the 3D scene */
  --glucose: #4fd6e8;
  --pyruvate: #5fa8ff;
  --acetyl: #b18cff;
  --nadh: #6ee7a0;
  --fadh: #ffb347;
  --atp: #ffd75e;
  --co2: #a9b4c2;
  --proton: #ff5d73;
  --electron: #d8f1ff;
  --fat: #f1e4bd;
  --amino: #ff79c6;
  --fdg: #ff8a3d;
  --rbc: #ff5f6d;
  --neut: #f2a6c8;
  --eos: #ff6a3d;
  --baso: #8f7bff;
  --lymph: #5fb4ff;
  --mono: #9fd6c2;
  --plt: #d9b3ff;
  --tag-m: #ff4fd8;
  --tag-k: #38b6ff;
  --carbon: #8793a5;
  --oxygen: #ff5a52;
  --mito: #ff6a4d;
  --nucleus: #6a86ff;
  --golgi: #c9a6ff;
  --lyso: #8fd16a;
  --membrane: #4aa3b5;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; overflow: hidden; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
.stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em; color: var(--fg);
  background: rgba(8, 13, 21, .78); border: 1px solid var(--line);
  padding: 5px 8px 5px 7px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px;
  transition: border-color .2s, background .2s, opacity .2s;
}
.lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, var(--accent)); flex: none; }
.lbl.click { pointer-events: auto; cursor: pointer; font: 500 11px/1 var(--f-mono); color: var(--fg); }
.lbl.click:hover, .lbl.on { border-color: var(--c, var(--accent)); background: rgba(14, 22, 34, .92); }
.lbl.dim { opacity: .45; }
.lbl small { color: var(--muted); font-size: 10px; }

.hud { position: absolute; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); right: 14px; justify-content: space-between; }
.hint { font: 400 11px/1.3 var(--f-mono); color: var(--muted); background: rgba(8,13,21,.6); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
.ghost-btn {
  font: 500 12px/1 var(--f-body); color: var(--fg); background: rgba(8,13,21,.7);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer;
}
.ghost-btn:hover { border-color: var(--muted); }
.hud-bottom { bottom: 14px; left: max(14px, env(safe-area-inset-left, 0px)); flex-direction: column; align-items: flex-start; gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: min(560px, calc(100% - 20px)); background: rgba(8,13,21,.66); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font: 400 11px/1.2 var(--f-mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 7px var(--c); }
.scale { font: 500 11px/1 var(--f-mono); color: var(--fg); display: flex; flex-direction: column; gap: 5px; }
.scale .bar { height: 6px; border: 1.5px solid var(--fg); border-top: 0; width: 80px; transition: width .15s; }
.scale .cap { color: var(--muted); font-weight: 400; }
.fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .32s ease; display: grid; place-items: center; }
.fade.on { opacity: 1; }
.fade span { font: 500 12px/1 var(--f-mono); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

/* ---------- panel ---------- */
.panel { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg-2); border-left: 1px solid var(--line); scrollbar-color: var(--line) transparent; }
.panel-inner {
  padding-block: 26px 34px;
  padding-left: max(26px, env(safe-area-inset-left, 0px));
  padding-right: max(26px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
h1 { margin: 0; font: 700 30px/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
h2 { margin: 0; font: 700 25px/1.12 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
h3 { margin: 0; font: 600 14px/1.3 var(--f-body); }
p { margin: 0; }
.muted { color: var(--muted); }

.rail { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.rail button {
  appearance: none; border: 0; background: none; padding: 8px 0 0; cursor: pointer; text-align: left;
  color: var(--muted); font: 500 11px/1 var(--f-mono); border-top: 3px solid var(--line);
  transition: color .2s, border-color .2s;
}
.rail button:hover { color: var(--fg); }
.rail button.done { border-top-color: #33506a; }
.rail button.on { color: var(--fg); border-top-color: var(--accent); }
.rail-name { font: 500 12px/1.3 var(--f-mono); color: var(--muted); margin-top: -12px; }

.chapter { display: flex; flex-direction: column; gap: 16px; }
.chapter .lede { font-size: 16px; line-height: 1.6; color: #d4dde8; }
.chapter ul.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.chapter ul.facts li { padding-left: 16px; position: relative; color: #cdd6e2; }
.chapter ul.facts li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.m { font: 500 .92em/1 var(--f-mono); color: var(--c, var(--fg)); white-space: nowrap; }
.eq {
  font: 400 13px/1.6 var(--f-mono); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; color: var(--muted);
}
.callout { border: 1px solid #4a3220; background: linear-gradient(0deg, rgba(255,138,61,.06), rgba(255,138,61,.06)), var(--surface); border-radius: 10px; padding: 14px 15px; display: flex; flex-direction: column; gap: 6px; }
.callout .eyebrow { color: var(--fdg); }
.callout p { color: #d9dee6; font-size: 14px; }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details summary { cursor: pointer; padding: 11px 14px; font-weight: 500; font-size: 14px; list-style-position: inside; }
details ol { margin: 0; padding: 0 16px 14px 34px; font-size: 13.5px; color: #cdd6e2; display: flex; flex-direction: column; gap: 5px; }
details ol b { font-weight: 600; color: var(--fg); }

/* organelle picker */
.orgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.org {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; display: flex; gap: 9px; align-items: flex-start; font: inherit; min-width: 0;
}
.org i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); margin-top: 6px; flex: none; }
.org b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.org small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.org:hover { border-color: #334459; }
.org.on { border-color: var(--c); }
.org-card { border-left: 2px solid var(--c, var(--line)); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
.org-card p { color: #cdd6e2; font-size: 14px; }

/* fuel routes */
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; }
.route .path { font: 400 12.5px/1.5 var(--f-mono); color: var(--muted); }
.route p { font-size: 13.5px; color: #cdd6e2; }

/* krebs widget */
.krebs { display: flex; flex-direction: column; gap: 12px; }
.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; }
.step-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.step-n { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.enzyme { font: 500 12px/1.3 var(--f-mono); color: var(--acetyl); text-align: right; }
.rxn { font: 500 16px/1.45 var(--f-display); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.rxn .c { font: 500 11px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; vertical-align: 2px; margin-left: 3px; }
.rxn .arrow { color: var(--muted); }
.step-card p { font-size: 14px; color: #cdd6e2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--f-mono); color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 5px 9px; background: rgba(0,0,0,.2); }
.chip.none { color: var(--muted); border-color: var(--line); }
.ctl { display: flex; gap: 6px; }
.btn {
  appearance: none; cursor: pointer; font: 500 13px/1 var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px;
}
.btn:hover { border-color: #3a4d65; }
.btn.primary { background: #16303a; border-color: #2a6170; color: #dff8fc; flex: 1; }
.dots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.dots button {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 6px; padding: 7px 0; font: 500 11px/1 var(--f-mono);
}
.dots button.on { color: var(--bg); background: var(--acetyl); border-color: var(--acetyl); }
.tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; }
.tally b { font: 500 18px/1 var(--f-mono); color: var(--c); font-variant-numeric: tabular-nums; }
.tally small { font: 400 11px/1.2 var(--f-mono); color: var(--muted); }
.mnemonic { font-size: 13px; color: var(--muted); }
.mnemonic b { color: var(--fg); font-weight: 600; }

/* carbon tracer */
.tracer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.tr-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tr-head .btn { padding: 7px 10px; font-size: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.carbon { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 40px; }
.carbon i { width: 26px; height: 26px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font: 500 11px/1 var(--f-mono); font-style: normal; color: #06101a; }
.carbon.hot i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c), 0 0 12px var(--c); }
.carbon small { font: 400 10px/1.1 var(--f-mono); color: var(--muted); }
.tracer p { font-size: 13.5px; color: #d4dde8; min-height: 4.8em; }
.fates { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fates div { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 400 11px/1.35 var(--f-mono); color: var(--muted); }
.fates b { display: block; color: var(--c); font-weight: 500; }
.credit { font-size: 12px; color: var(--muted); }
.credit a { color: var(--accent); }

/* blood cells */
.diff { display: flex; flex-direction: column; gap: 2px; }
.diff button { appearance: none; border: 0; background: none; color: var(--fg); font: 400 12.5px/1.2 var(--f-body); display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; padding: 5px 4px; cursor: pointer; text-align: left; border-radius: 6px; }
.diff button:hover, .diff button.on { background: var(--surface); }
.diff .track { position: relative; height: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.diff .track i { position: absolute; top: -1px; bottom: -1px; background: var(--c); border-radius: 4px; min-width: 3px; }
.diff .num { font: 400 11px/1 var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.diff .axis { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; padding: 0 4px; font: 400 10px/1 var(--f-mono); color: var(--muted); }
.diff .axis span:nth-child(2) { display: flex; justify-content: space-between; }
.cell-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 11px; }
.cell-card h3 { font: 700 19px/1.2 var(--f-display); color: var(--c); }
.cell-card p { font-size: 14px; color: #cdd6e2; }
.cell-card dl { margin: 0; display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 6px 10px; font-size: 13.5px; }
.cell-card dt { font: 500 10.5px/1.9 var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.cell-card dd { margin: 0; color: #d4dde8; }
.sub { display: flex; flex-wrap: wrap; gap: 6px; }
.sub .btn { padding: 8px 10px; font-size: 12.5px; }
.sub .btn.on { border-color: var(--c); background: var(--bg-2); }
.cell-card table.ledger { font-size: 12.5px; }
.cell-card .ledger th, .cell-card .ledger td { padding: 6px 8px; }

/* ledger */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.ledger { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.ledger th, .ledger td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger th { font: 500 10.5px/1.2 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; background: var(--surface); }
.ledger td small { color: var(--muted); display: block; font-size: 11px; }
.ledger tr.sum td { font-weight: 600; border-bottom: 0; background: rgba(79,214,232,.05); }
.big { display: flex; align-items: baseline; gap: 10px; }
.big b { font: 700 54px/1 var(--f-display); color: var(--atp); letter-spacing: -.03em; }
.big span { color: var(--muted); font-size: 14px; line-height: 1.35; }

.pager { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
.pager .btn { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; flex: 1; }
.pager .btn small { font: 500 10px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.pager .btn.next { align-items: flex-end; text-align: right; }
.pager .btn[disabled] { opacity: .35; cursor: default; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  body { overflow: hidden; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(280px, 50%) minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .panel-inner { padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 18px; }
  h1 { font-size: 24px; }
  h2 { font-size: 22px; }
  .hint { display: none; }
  .legend { display: none; }
  .lbl { font-size: 10px; padding: 4px 7px 4px 6px; }
}
@media (max-width: 420px) {
  .orgs { grid-template-columns: 1fr; }
  .tally { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .fade, .scale .bar, .lbl { transition: none; }
}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D view of the cell">
    <canvas id="gl" tabindex="0" aria-label="Interactive 3D cell. Drag to orbit, scroll or pinch to zoom."></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud hud-top">
      <span class="hint">Drag to orbit · scroll or pinch to zoom</span>
      <button class="ghost-btn" id="resetView" type="button">Reset view</button>
    </div>
    <div class="hud hud-bottom">
      <div class="legend" id="legend"></div>
      <div class="scale" aria-hidden="true"><span id="scaleTxt">5 µm</span><div class="bar" id="scaleBar"></div></div>
    </div>
    <div class="fade" id="fade"><span id="fadeTxt">Zooming in</span></div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-inner">
      <header class="brand">
        <span class="eyebrow">From your plate to ATP</span>
        <h1>Inside the <em>Cell City</em></h1>
      </header>
      <nav class="rail" id="rail" aria-label="Chapters"></nav>
      <div class="rail-name" id="railName"></div>
      <article class="chapter" id="chapter" aria-live="polite"></article>
      <div class="pager">
        <button class="btn prev" id="prevBtn" type="button"><small>Previous</small><span id="prevName"></span></button>
        <button class="btn next" id="nextBtn" type="button"><small>Next</small><span id="nextName"></span></button>
      </div>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================================================================
   Chapter content
   ================================================================ */
const m = (txt, c) => `<span class="m" style="--c:var(--${c})">${txt}</span>`;

const ORGANELLES = [
  { id: 'nucleus', name: 'Nucleus', role: 'Head office & archive', c: 'nucleus',
    text: 'Holds the blueprints: about 2 metres of DNA folded into a sphere roughly 6 µm across. Orders go out as messenger RNA through thousands of nuclear pores.' },
  { id: 'er', name: 'Rough ER', role: 'Production line', c: 'membrane',
    text: 'A maze of membrane sheets studded with ribosomes. Proteins meant for export or for membranes are built and folded here.' },
  { id: 'golgi', name: 'Golgi apparatus', role: 'Shipping & packaging', c: 'golgi',
    text: 'A stack of flattened sacs that trims, tags and sorts proteins, then buds them off in vesicles addressed to their destination.' },
  { id: 'mito', name: 'Mitochondria', role: 'Power plants', c: 'mito',
    text: 'Where the Krebs cycle and the electron transport chain run. A liver cell has around a thousand or more; heart muscle is packed with them.' },
  { id: 'lyso', name: 'Lysosomes', role: 'Recycling centre', c: 'lyso',
    text: 'Acidic sacs (pH about 4.5 to 5) full of digestive enzymes that break down worn-out parts and anything the cell swallows.' },
  { id: 'ribo', name: 'Ribosomes', role: 'Assembly benches', c: 'co2',
    text: 'Molecular machines that read mRNA and link amino acids into proteins. Free ones in the cytosol make the cell’s own working proteins.' },
  { id: 'cyto', name: 'Cytoskeleton', role: 'Roads & rail', c: 'pyruvate',

   Carbon order per intermediate:
     oxaloacetate [1,2,3,4]; citrate and isocitrate [oaa1, oaa2, oaa3, oaa4, acetyl CH2, acetyl COO];
     alpha-ketoglutarate [oaa4, oaa3, oaa2, CH2, COO]; succinyl-CoA onward [4 carbons]. */
/*TRACE-START*/
function traceTurn(oaa, acetyl, flip) {
  const [o1, o2, o3, o4] = oaa, [aM, aK] = acetyl;
  const cit = [o1, o2, o3, o4, aM, aK];
  const akg = [o4, o3, o2, aM, aK];              // isocitrate dehydrogenase removes oaa1
  const scoa = [o3, o2, aM, aK];                 // alpha-KG dehydrogenase removes oaa4
  const fum = flip ? scoa.slice().reverse() : scoa.slice(); // succinate is symmetrical
  return { nodes: [oaa.slice(), cit, cit, akg, scoa, scoa, fum, fum], released: { 2: o1, 3: o4 }, end: fum };
}
function makeTrace(rand) {
  const turns = [];
  return function turn(n) {                      // n starts at 1
    while (turns.length < n) {
      const i = turns.length;
      turns.push(traceTurn(i ? turns[i - 1].end : [0, 0, 0, 0], i ? [0, 0] : ['M', 'K'], rand() < 0.5));
    }
    return turns[n - 1];
  };
}

  const std = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, emissive: color, emissiveIntensity: 0.22, roughness: 0.55 }, extra));
  function lumpy(r, amp, seed, seg = 48) {
    const geo = new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75));
    const p = geo.attributes.position, v = new V3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const k = Math.sin(v.x * 1.7 / r * 2.2 + seed) * Math.cos(v.y * 2.3 / r * 1.8 + seed * 2) + Math.sin(v.z * 3.1 / r * 1.5 + seed * 3) * 0.6;
      v.multiplyScalar(1 + k * amp); p.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals(); return geo;
  }
  function membraneShell(r, color, amp, seed) {
    const g = new THREE.Group(), geo = lumpy(r, amp, seed, 64);
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.09, depthWrite: false, roughness: 0.4 })));
    g.add(new THREE.Mesh(geo, fresnelMat(color, 1.0, 2.5)));
    return g;
  }
  function lobe(parent, mat, pos, scale, seed, amp = 0.06) {
    const m = new THREE.Mesh(lumpy(1, amp, seed, 32), mat); m.position.set(...pos); m.scale.set(...scale); parent.add(m); return m;
  }
  function strand(parent, mat, a, b, bend) {
    const A = new V3(...a), Bv = new V3(...b), mid = A.clone().lerp(Bv, 0.5).add(new V3(...bend));
    parent.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([A, mid, Bv]), 24, 0.17, 8, false), mat));
  }
  function granules(parent, color, n, size, R0, avoid) {
    const im = new THREE.InstancedMesh(atomGeo, std(color, { emissiveIntensity: 0.4 }), n);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
    let i = 0, guard = 0;
    while (i < n && guard++ < 20000) {
      const v = new V3(rr(-1, 1), rr(-1, 1), rr(-1, 1));
      if (v.length() > 1) continue;
      v.multiplyScalar(R0 - size - 0.3);
      if (avoid.some(([c, rad]) => v.distanceTo(c) < rad + size * 0.6)) continue;
      const s = size * rr(0.8, 1.15);
      m4.compose(v, q, new V3(s, s, s)); im.setMatrixAt(i++, m4);
    }
    im.count = i; parent.add(im); return im;
  }
  function miniMitos(parent, n, R0, avoid) {
    const geo = new THREE.CapsuleGeometry(0.26, 0.75, 4, 10), mat = std(C.mito, { emissiveIntensity: 0.45 });
    let i = 0, guard = 0;
    while (i < n && guard++ < 3000) {
      const v = new V3(rr(-1, 1), rr(-1, 1), rr(-1, 1));
      if (v.length() > 1) continue;
      v.multiplyScalar(R0 - 0.8);
      if (avoid.some(([c, rad]) => v.distanceTo(c) < rad + 0.4)) continue;
      const m = new THREE.Mesh(geo, mat); m.position.copy(v); m.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3)); parent.add(m); i++;
    }
  }
  function redCellGeo(R0) {                        // Evans & Fung thickness profile, scaled to radius R0
    const half = (x) => 0.5 * Math.sqrt(Math.max(0, 1 - x * x)) * (0.81 + 7.83 * x * x - 4.39 * Math.pow(x, 4)) * (R0 / 3.91);
    const pts = [], N = 40;
    for (let i = 0; i <= N; i++) { const x = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(x * R0, -half(x))); }
    for (let i = N - 1; i >= 0; i--) { const x = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(x * R0, half(x))); }
    const geo = new THREE.LatheGeometry(pts, 72); geo.computeVertexNormals(); return geo;
  }
  function makeCell(id) {
    const root = new THREE.Group(); root.position.copy(BPOS[id]); bloodGroup.add(root);
    const body = new THREE.Group(); root.add(body);
    const r = BRAD[id];
    cells[id] = { root, body, r };

    body.add(membraneShell(r, BC[id], id === 'mono' ? 0.035 : 0.014, id.length * 1.7));
    const nm = std(new THREE.Color(0x6d4bd0), { emissiveIntensity: 0.3, roughness: 0.7 });
    const av = [];
    if (id === 'neut') {
      const lobes = [[-3.1, -0.9, 0.2], [-1.5, 1.9, -0.4], [1.8, 2.0, 0.3], [2.8, -1.4, -0.2]];

    } else if (id === 'baso') {

      cells[id].grains = granules(body, new THREE.Color(0x4a35c9), 120, 0.58, r, []); miniMitos(body, 4, r, []);
    } else if (id === 'lymph') {

    } else if (id === 'mono') {
      const horse = new THREE.Group(); horse.position.set(-0.5, -0.2, 0); body.add(horse);
      const arc = 4.1, rad = 3.0, tube = 1.95;

    }
  }

  function fitPose(pose) {
    const a = camera.aspect;
    const off = pose.pos.clone().sub(pose.target);
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const need = pose.w ? pose.w / (tanH * Math.min(a, 1.6)) : 0;
    const len = Math.max(off.length(), need);
    return { pos: pose.target.clone().add(off.setLength(len)), target: pose.target.clone() };
  }

  }

    const mol = molecule(6, fdg ? C.fdg : C.glucose, { shape: 'ring', special: fdg ? C.fdg : null, glowSize: fdg ? 3 : 2.2 });

            if (u >= 1) { disposeObj(o); return false; }
            return true;
          }, o);
        },
      });
      return;
    }
    travel(cellGroup, mol, [start, D.clone().multiplyScalar(15), GLUT, inside, SPLIT], 4, {

        [-1, 1].forEach((s, i) => {

        return u < 7.5;
      });
      later(3.0, () => say(root, 'squeezing through a capillary', BC.rbc, new V3(0, 4.6, 2), 2.0, 0.8));
      later(5.2, () => {
        say(root, 'O₂ released to tissue', new THREE.Color(0xd8f1ff), new V3(0, 4.6, 2), 2.2);
        for (let i = 0; i < 10; i++) { const d = randDir(); travel(root, ball(new THREE.Color(0xd8f1ff), 0.2, 0.8), [d.clone().multiplyScalar(2), d.clone().multiplyScalar(9)], 1.6, { shrinkEnd: true, ease: ease.out }); }
      });
      return 8;
    },
    neut(c) {
      const green = col('lyso');
      [0, 1, 2].forEach(i => {
        const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 1.2, 4, 10), std(green, { emissiveIntensity: 0.6 }));
        const inside = new V3(-0.2 + i * 0.9, -3.6 + (i % 2) * 0.7, 3.2);
        travel(c.root, b, [new V3(8 + i * 2, -9 + i, 6), new V3(3.5 + i, -6.5, 5), inside], 2.6, { delay: i * 0.25, spin: 1.2, keep: true, onDone: o => later(2.2, () => pulse(o, 1.0, 1, 0)) });
      });
      later(3.0, () => {
        const centre = new V3(0.7, -3.4, 3.2);
        const bag = new THREE.Group(); bag.position.copy(centre); bag.add(new THREE.Mesh(atomGeo, fresnelMat(new THREE.Color(0xffd6ec), 1.3, 2))); c.root.add(bag);
        pulse(bag, 0.5, 0.2, 2.4, 2.4);
        say(c.root, 'phagosome', BC.neut, new V3(0.7, -0.6, 5), 1.8, 0.8);
        for (let i = 0; i < 40; i++) { const from = randDir().multiplyScalar(rr(3, 5.6)); travel(c.root, ball(BC.neut, 0.2, 0.5), [from, centre.clone().add(randDir())], 1.0, { delay: rr(0, 0.8), shrinkEnd: true }); }
      });
      later(4.3, () => {
        say(c.root, 'oxidative burst', col('atp'), new V3(0.7, -0.6, 5), 2.2);
        for (let i = 0; i < 26; i++) { const at = new V3(0.7, -3.4, 3.2); travel(c.root, ball(col('atp'), 0.12, 1.0), [at, at.clone().add(randDir().multiplyScalar(2.2))], 0.9, { delay: rr(0, 0.9), shrinkEnd: true, ease: ease.out }); }
      });
      return 7.5;
    },
    eos(c) {
      const pts = []; for (let i = 0; i <= 14; i++) pts.push(new V3(-9 + i * 1.3, Math.sin(i * 0.8) * 1.0, 0));
      const worm = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 100, 0.9, 14, false), std(new THREE.Color(0xd9c48a), { emissiveIntensity: 0.2 }));
      worm.position.set(1, -9.4, 1); c.root.add(worm);
      const t0 = now;
      every(t => { const u = t - t0; worm.position.x = 1 + Math.sin(u * 2.4) * 0.5; worm.rotation.z = Math.sin(u * 3.1) * 0.05 * Math.max(0, 1 - (u - 4) / 2); if (u > 6.5) worm.scale.setScalar(Math.max(0.001, 1 - (u - 6.5))); if (u > 7.5) { disposeObj(worm); return false; } return true; }, worm);
      say(c.root, 'parasite (not to scale)', new THREE.Color(0xe6d49a), new V3(0, -12.4, 3), 3, 0.8);
      later(1.8, () => {
        say(c.root, 'degranulation', BC.eos, new V3(0, 7.6, 3), 2.6);
        for (let i = 0; i < 55; i++) { const from = new V3(rr(-3.5, 3.5), rr(-5.5, -2), rr(-2, 2)); travel(c.root, ball(BC.eos, rr(0.25, 0.42), 0.6), [from, new V3(rr(-4, 4), -6.8, 2), new V3(rr(-7, 8), -9.4 + rr(-.8, .8), rr(0.5, 2.4))], 1.8, { delay: rr(0, 2.4), shrinkEnd: true }); }
      });
      return 8.5;
    },
    baso(c) {
      const ige = col('atp');
      [-0.45, 0.05].forEach(off => {
        const a = Math.PI / 2 + off, ab = antibody(ige); ab.scale.setScalar(1.3);
        ab.position.set(Math.cos(a) * (c.r + 0.65), Math.sin(a) * (c.r + 0.65), 0); ab.rotation.z = a - Math.PI / 2; c.root.add(ab); pulse(ab, 0.3, 0.4, 1.3, 6.4);
      });
      say(c.root, 'IgE on surface', ige, new V3(-4.5, 8, 2), 2.2, 0.8);
      const allergen = ball(col('lyso'), 0.8, 2.4);
      travel(c.root, allergen, [new V3(9, 13, 2), new V3(3, 10.5, 1), new V3(1.15, 8.1, 0)], 2.2, { keep: true, onDone: o => later(3.5, () => pulse(o, 0.6, 1, 0)) });
      later(2.4, () => {
        say(c.root, 'histamine release', BC.baso, new V3(0, -8.4, 3), 3);
        for (let i = 0; i < 70; i++) { const d = randDir(); travel(c.root, ball(new THREE.Color(0x7c63ff), rr(0.25, 0.45), 0.8), [d.clone().multiplyScalar(rr(2, 5)), d.clone().multiplyScalar(rr(9, 12))], 2.2, { delay: rr(0, 1.8), shrinkEnd: true, ease: ease.out }); }
      });
      return 7.5;
    },
    mono(c) {
      const old = new THREE.Group();
      const disc = new THREE.Mesh(redCellGeo(3.0), std(DEOXY.clone(), { emissiveIntensity: 0.4 })); disc.rotation.x = 1.0; old.add(disc);
      const at = new V3(4.0, -2.8, 4.2);
      travel(c.root, old, [new V3(17, -9, 6), new V3(11.5, -7, 5.5), at], 2.8, { keep: true, spin: 0.35, onDone: o => later(1.2, () => pulse(o, 2.4, 1, 0)) });
      say(c.root, 'worn-out red cell', BC.rbc, new V3(11, -2, 5), 2.4, 0.85);
      const t0 = now;
      every(t => {
        const u = t - t0, k = u > 2 && u < 6 ? Math.sin((u - 2) / 4 * Math.PI) : 0;
        c.body.scale.set(1 + k * 0.17, 1 - k * 0.05, 1); c.body.position.set(k * 0.8, -k * 0.5, 0);
        return u < 6.2;
      });
      later(3.2, () => say(c.root, 'engulfed and digested', BC.mono, new V3(0, 10, 3), 2.4));
      later(5.2, () => {
        say(c.root, 'iron recovered', col('fadh'), new V3(6, 1, 5), 2.4, 0.85);
        for (let i = 0; i < 14; i++) travel(c.root, ball(col('fadh'), 0.22, 0.9), [at.clone(), at.clone().add(randDir().multiplyScalar(4.5))], 1.8, { delay: rr(0, 0.7), shrinkEnd: true, ease: ease.out });
      });
      return 8.5;
    },
    lymph(c) { return ACTIONS['lymph_' + bloodState.sub](c); },
    lymph_b(c) {
      const gold = col('atp');
      const virus = new THREE.Group(); virus.add(ball(col('lyso'), 1.1, 2.2));
      for (let i = 0; i < 18; i++) { const s0 = ball(col('lyso'), 0.2); s0.position.copy(randDir().multiplyScalar(1.35)); virus.add(s0); }
      virus.position.set(7.8, 4.4, 2); c.root.add(virus); pulse(virus, 0.3, 0.6, 1, 6.2);
      say(c.root, 'virus (not to scale)', col('lyso'), new V3(7.8, 6.8, 2), 2.4, 0.65);
      for (let i = 0; i < 38; i++) {
        const d = randDir(), hit = i % 3 === 0;
        const ab = antibody(gold); ab.scale.setScalar(0.8); ab.rotation.z = rr(0, 6.28);
        const end = hit ? virus.position.clone().add(randDir().multiplyScalar(1.7)) : d.clone().multiplyScalar(rr(8, 11));
        travel(c.root, ab, [d.clone().multiplyScalar(4), d.clone().multiplyScalar(6.2), end], 2.2, { delay: 0.5 + i * 0.09, keep: hit, shrinkEnd: !hit, onDone: hit ? o => later(2.0, () => disposeObj(o)) : null });
      }
      later(1.4, () => say(c.root, 'antibodies', gold, new V3(-4.5, 6, 3), 3, 0.8));
      return 7.5;
    },
    killer(c, text, targetColor) {
      const target = new THREE.Group();
      const shell = membraneShell(3.2, targetColor, 0.05, 3); target.add(shell);
      target.add(ball(targetColor, 1.4, 3));
      const docked = new V3(7.4, -1.4, 0);
      travel(c.root, target, [new V3(16, -7, 2), new V3(11, -3.5, 1), docked], 2.2, { keep: true });
      say(c.root, text, targetColor, new V3(8.4, 3.8, 3), 2.8, 0.7);
      later(2.5, () => {
        say(c.root, 'perforin + granzymes', col('atp'), new V3(0, -6.8, 3), 2.6, 0.7);
        for (let i = 0; i < 30; i++) travel(c.root, ball(col('atp'), 0.16, 0.7), [new V3(3.2, -0.6 + rr(-1, 1), rr(-1, 1)), new V3(4.5, -0.8 + rr(-.6, .6), rr(-.6, .6)), docked.clone().add(randDir())], 1.0, { delay: rr(0, 1.4), shrinkEnd: true });
      });
      later(4.6, () => {
        say(c.root, 'apoptosis', targetColor, new V3(8.4, 3.8, 3), 2.2, 0.8);
        disposeObj(target);
        for (let i = 0; i < 9; i++) { const blob = membraneShell(rr(0.6, 1.2), targetColor, 0.05, i); blob.add(ball(targetColor, 0.28)); travel(c.root, blob, [docked.clone().add(randDir()), docked.clone().add(randDir().multiplyScalar(4.5))], 2.2, { shrinkEnd: true, ease: ease.out }); }
      });
      return 8;
    },
    lymph_t(c) { return ACTIONS.killer(c, 'infected cell', col('lyso')); },
    lymph_nk(c) { return ACTIONS.killer(c, 'no MHC I tag', col('fadh')); },
  };

  const blood = { focused: null, next: 0 };
  function resetBlood() {
    clearAgents();
    Object.values(cells).forEach(c => c.root.children.filter(o => !c.parts.has(o)).forEach(disposeObj));
    Object.values(cells).forEach(c => { c.body.scale.set(1, 1, 1); c.body.position.set(0, 0, 0); c.root.rotation.set(0, 0, 0); });
    cells.rbc.mat.color.copy(BC.rbc); cells.rbc.mat.emissive.copy(BC.rbc);
  }
  function focusBlood(id) {
    if (stageId !== 'blood') return;
    resetBlood();
    blood.focused = id; blood.next = now + 1.4;
    Object.entries(cells).forEach(([k, c]) => { c.root.visible = !id || k === id; });
    platelets.visible = !id;
    labels.forEach(l => { if (l.blood) l.el.classList.toggle('on', l.blood === id); });
    if (!id) { tweenTo(fitPose(POSES.blood), 1.2); return; }
    const target = BPOS[id].clone();
    const half = { rbc: 11, neut: 12, lymph: 13, mono: 15, eos: 13.5, baso: 13.5 }[id];
    const dist = half / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.min(camera.aspect, 1.15));
    tweenTo({ pos: target.clone().add(new V3(0, 0, dist)), target }, 1.2);
  }
  B.blood = {
    enter() {
      resetBlood(); blood.focused = null;
      Object.values(cells).forEach(c => { c.root.visible = true; }); platelets.visible = true;
      bloodView = { focus: focusBlood };
      bloodState.id = null; selectBlood(null);
      blood.next = Infinity;
    },
    tick(t) {
      const id = blood.focused;
      if (id) {
        if (t > blood.next) { resetBlood(); blood.next = t + ACTIONS[id](cells[id]) + 0.6; }
      } else {
        Object.values(cells).forEach((c, i) => { c.root.rotation.y = reduceMotion ? 0 : Math.sin(t * 0.5 + i) * 0.35; });
        platelets.rotation.z = reduceMotion ? 0 : Math.sin(t * 0.4) * 0.12;
      }
    },
    exit() { bloodView = null; resetBlood(); },
  };

  /* ================= chapter changes ================= */
  setupPanel((id, prevId) => {
    if (B[stageId] && B[stageId].exit) B[stageId].exit();
    clearAgents();
    stageId = id;
    labels.forEach(l => { l.el.classList.remove('on'); });
    goStage(id, !started);
    if (B[id] && B[id].enter) B[id].enter();
    started = true;
  });
  let started = false;

  /* ================= resize ================= */
  function resize() {
    const r = stageEl.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();

  const initial = CHAPTERS.findIndex(c => c.id === location.hash.slice(1));
  showChapter(initial >= 0 ? initial : 0);

  /* ================= frame loop ================= */
  const scaleTxt = $('#scaleTxt'), scaleBar = $('#scaleBar'), fadeEl = $('#fade');
  const clock = new THREE.Clock();
  const tmp = new V3();
  let lastScaleUpdate = 0;
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, clock.getDelta());
    dtG = dt; now += dt;

    if (tween) {
      const u = Math.min(1, (now - tween.start) / tween.dur), e = ease.inOut(u);
      camera.position.lerpVectors(tween.p0, tween.p1, e);
      controls.target.lerpVectors(tween.t0, tween.t1, e);
      if (u >= 1) tween = null;
    }
    controls.update();

    // ambient life
    const amb = reduceMotion ? 0.2 : 1;
    if (cellGroup.visible) {
      mitos.forEach((mm, i) => {
        const d = mm.userData;
        mm.position.set(d.base.x + Math.sin(now * 0.4 + d.ph) * 0.12 * amb, d.base.y + Math.cos(now * 0.35 + d.ph) * 0.12 * amb, d.base.z);
        mm.rotation.y += dt * 0.08 * amb;
        const mat = mm.children[0].material;
        mat.emissiveIntensity = stageId === 'tally' ? 0.55 + Math.sin(now * 3 + i) * 0.25 : 0.35;
      });
      lysos.forEach(l => { const d = l.userData; l.position.set(d.base.x + Math.sin(now * 0.3 + d.ph) * 0.2 * amb, d.base.y + Math.sin(now * 0.25 + d.ph * 2) * 0.2 * amb, d.base.z + Math.cos(now * 0.3 + d.ph) * 0.2 * amb); });
      nucleus.rotation.y += dt * 0.02 * amb;
    }
    if (mitoGroup.visible) {
      cristae.forEach(c => { c.material.opacity += (cristaeTarget - c.material.opacity) * Math.min(1, dt * 3); });
    }

    const b = B[stageId];
    if (b && b.tick) b.tick(now, dt);
    const list = agents; agents = [];
    for (const a of list) if (a.update(now)) agents.push(a);

    renderer.render(scene, camera);

    // labels
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const fading = fadeEl.classList.contains('on');
    for (const l of labels) {
      const show = !fading && l.stages.includes(stageId) && l.parent.visible !== false && GROUPS[currentGroup] && isIn(l.parent, GROUPS[currentGroup]);
      if (!show) { if (!l.el.hidden) l.el.hidden = true; continue; }
      tmp.copy(l.anchor).applyMatrix4(l.parent.matrixWorld).project(camera);
      if (tmp.z > 1 || tmp.x < -1.2 || tmp.x > 1.2 || tmp.y < -1.2 || tmp.y > 1.2) { l.el.hidden = true; continue; }
      l.el.hidden = false;
      l.el.style.transform = `translate(${((tmp.x + 1) / 2 * w).toFixed(1)}px, ${((1 - tmp.y) / 2 * h).toFixed(1)}px) translate(-50%, -50%)`;
    }

    // scale bar
    if (now - lastScaleUpdate > 0.1) {
      lastScaleUpdate = now;
      const dist = camera.position.distanceTo(controls.target);
      const pxPerUnit = (h / 2) / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist);
      const pxPerNm = pxPerUnit * UNITS_PER_NM[currentGroup];
      const want = 90 / pxPerNm;
      const pow = Math.pow(10, Math.floor(Math.log10(want)));
      const nice = [1, 2, 5, 10].map(v => v * pow).reduce((bst, v) => Math.abs(v * pxPerNm - 90) < Math.abs(bst * pxPerNm - 90) ? v : bst);
      scaleBar.style.width = (nice * pxPerNm).toFixed(0) + 'px';
      scaleTxt.textContent = nice >= 1000 ? `${+(nice / 1000).toPrecision(3)} µm` : `${+nice.toPrecision(3)} nm`;
    }
  }
  function isIn(obj, root) { let o = obj; while (o) { if (o === root) return true; o = o.parent; } return false; }
  requestAnimationFrame(frame);
}

if (renderer) init();
else buildPanelOnly();
})();
</script>
