<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Inside the Cell City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 3D walk through the cell, from the food you eat to glucose, glycolysis, the Krebs cycle and ATP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage (a fluorescence-microscope view) beside a chapter panel; on phones the panel stacks under the stage.
   Deliberately single-theme: the stage is a dark microscope field, so the whole page commits to it. */
:root {
  --bg: #060a11;
  --bg-2: #0b111b;
  --surface: #111a27;
  --line: #1d2939;
  --fg: #e6edf5;
  --muted: #8c9bb0;
  --accent: #4fd6e8;

  /* molecule colours, shared with the 3D scene */
  --glucose: #4fd6e8;
  --pyruvate: #5fa8ff;
  --acetyl: #b18cff;
  --nadh: #6ee7a0;
  --fadh: #ffb347;
  --atp: #ffd75e;
  --co2: #a9b4c2;
  --proton: #ff5d73;
  --electron: #d8f1ff;
  --fat: #f1e4bd;
  --amino: #ff79c6;
  --fdg: #ff8a3d;
  --mito: #ff6a4d;
  --nucleus: #6a86ff;
  --golgi: #c9a6ff;
  --lyso: #8fd16a;
  --membrane: #4aa3b5;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; overflow: hidden; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
.stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em; color: var(--fg);
  background: rgba(8, 13, 21, .78); border: 1px solid var(--line);
  padding: 5px 8px 5px 7px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px;
  transition: border-color .2s, background .2s, opacity .2s;
}
.lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, var(--accent)); flex: none; }
.lbl.click { pointer-events: auto; cursor: pointer; font: 500 11px/1 var(--f-mono); color: var(--fg); }
.lbl.click:hover, .lbl.on { border-color: var(--c, var(--accent)); background: rgba(14, 22, 34, .92); }
.lbl.dim { opacity: .45; }
.lbl small { color: var(--muted); font-size: 10px; }

.hud { position: absolute; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); right: 14px; justify-content: space-between; }
.hint { font: 400 11px/1.3 var(--f-mono); color: var(--muted); background: rgba(8,13,21,.6); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
.ghost-btn {
  font: 500 12px/1 var(--f-body); color: var(--fg); background: rgba(8,13,21,.7);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer;
}
.ghost-btn:hover { border-color: var(--muted); }
.hud-bottom { bottom: 14px; left: max(14px, env(safe-area-inset-left, 0px)); flex-direction: column; align-items: flex-start; gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: min(560px, calc(100% - 20px)); background: rgba(8,13,21,.66); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font: 400 11px/1.2 var(--f-mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 7px var(--c); }
.scale { font: 500 11px/1 var(--f-mono); color: var(--fg); display: flex; flex-direction: column; gap: 5px; }
.scale .bar { height: 6px; border: 1.5px solid var(--fg); border-top: 0; width: 80px; transition: width .15s; }
.scale .cap { color: var(--muted); font-weight: 400; }
.fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .32s ease; display: grid; place-items: center; }
.fade.on { opacity: 1; }
.fade span { font: 500 12px/1 var(--f-mono); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

/* ---------- panel ---------- */
.panel { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg-2); border-left: 1px solid var(--line); scrollbar-color: var(--line) transparent; }
.panel-inner {
  padding-block: 26px 34px;
  padding-left: max(26px, env(safe-area-inset-left, 0px));
  padding-right: max(26px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
h1 { margin: 0; font: 700 30px/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
h2 { margin: 0; font: 700 25px/1.12 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
h3 { margin: 0; font: 600 14px/1.3 var(--f-body); }
p { margin: 0; }
.muted { color: var(--muted); }

.rail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.rail button {
  appearance: none; border: 0; background: none; padding: 8px 0 0; cursor: pointer; text-align: left;
  color: var(--muted); font: 500 11px/1 var(--f-mono); border-top: 3px solid var(--line);
  transition: color .2s, border-color .2s;
}
.rail button:hover { color: var(--fg); }
.rail button.done { border-top-color: #33506a; }
.rail button.on { color: var(--fg); border-top-color: var(--accent); }
.rail-name { font: 500 12px/1.3 var(--f-mono); color: var(--muted); margin-top: -12px; }

.chapter { display: flex; flex-direction: column; gap: 16px; }
.chapter .lede { font-size: 16px; line-height: 1.6; color: #d4dde8; }
.chapter ul.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.chapter ul.facts li { padding-left: 16px; position: relative; color: #cdd6e2; }
.chapter ul.facts li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.m { font: 500 .92em/1 var(--f-mono); color: var(--c, var(--fg)); white-space: nowrap; }
.eq {
  font: 400 13px/1.6 var(--f-mono); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; color: var(--muted);
}
.callout { border: 1px solid #4a3220; background: linear-gradient(0deg, rgba(255,138,61,.06), rgba(255,138,61,.06)), var(--surface); border-radius: 10px; padding: 14px 15px; display: flex; flex-direction: column; gap: 6px; }
.callout .eyebrow { color: var(--fdg); }
.callout p { color: #d9dee6; font-size: 14px; }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details summary { cursor: pointer; padding: 11px 14px; font-weight: 500; font-size: 14px; list-style-position: inside; }
details ol { margin: 0; padding: 0 16px 14px 34px; font-size: 13.5px; color: #cdd6e2; display: flex; flex-direction: column; gap: 5px; }
details ol b { font-weight: 600; color: var(--fg); }

/* organelle picker */
.orgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.org {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; display: flex; gap: 9px; align-items: flex-start; font: inherit; min-width: 0;
}
.org i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); margin-top: 6px; flex: none; }
.org b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.org small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.org:hover { border-color: #334459; }
.org.on { border-color: var(--c); }
.org-card { border-left: 2px solid var(--c, var(--line)); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
.org-card p { color: #cdd6e2; font-size: 14px; }

/* fuel routes */
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; }
.route .path { font: 400 12.5px/1.5 var(--f-mono); color: var(--muted); }
.route p { font-size: 13.5px; color: #cdd6e2; }

/* krebs widget */
.krebs { display: flex; flex-direction: column; gap: 12px; }
.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; }
.step-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.step-n { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.enzyme { font: 500 12px/1.3 var(--f-mono); color: var(--acetyl); text-align: right; }
.rxn { font: 500 16px/1.45 var(--f-display); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.rxn .c { font: 500 11px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; vertical-align: 2px; margin-left: 3px; }
.rxn .arrow { color: var(--muted); }
.step-card p { font-size: 14px; color: #cdd6e2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--f-mono); color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 5px 9px; background: rgba(0,0,0,.2); }
.chip.none { color: var(--muted); border-color: var(--line); }
.ctl { display: flex; gap: 6px; }
.btn {
  appearance: none; cursor: pointer; font: 500 13px/1 var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px;
}
.btn:hover { border-color: #3a4d65; }
.btn.primary { background: #16303a; border-color: #2a6170; color: #dff8fc; flex: 1; }
.dots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.dots button {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 6px; padding: 7px 0; font: 500 11px/1 var(--f-mono);
}
.dots button.on { color: var(--bg); background: var(--acetyl); border-color: var(--acetyl); }
.tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; }
.tally b { font: 500 18px/1 var(--f-mono); color: var(--c); font-variant-numeric: tabular-nums; }
.tally small { font: 400 11px/1.2 var(--f-mono); color: var(--muted); }
.mnemonic { font-size: 13px; color: var(--muted); }
.mnemonic b { color: var(--fg); font-weight: 600; }

/* ledger */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.ledger { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.ledger th, .ledger td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger th { font: 500 10.5px/1.2 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; background: var(--surface); }
.ledger td small { color: var(--muted); display: block; font-size: 11px; }
.ledger tr.sum td { font-weight: 600; border-bottom: 0; background: rgba(79,214,232,.05); }
.big { display: flex; align-items: baseline; gap: 10px; }
.big b { font: 700 54px/1 var(--f-display); color: var(--atp); letter-spacing: -.03em; }
.big span { color: var(--muted); font-size: 14px; line-height: 1.35; }

.pager { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
.pager .btn { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; flex: 1; }
.pager .btn small { font: 500 10px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.pager .btn.next { align-items: flex-end; text-align: right; }
.pager .btn[disabled] { opacity: .35; cursor: default; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  body { overflow: hidden; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(280px, 50%) minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .panel-inner { padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 18px; }
  h1 { font-size: 24px; }
  h2 { font-size: 22px; }
  .hint { display: none; }
  .legend { display: none; }
  .lbl { font-size: 10px; padding: 4px 7px 4px 6px; }
}
@media (max-width: 420px) {
  .orgs { grid-template-columns: 1fr; }
  .tally { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .fade, .scale .bar, .lbl { transition: none; }
}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D view of the cell">
    <canvas id="gl" tabindex="0" aria-label="Interactive 3D cell. Drag to orbit, scroll or pinch to zoom."></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud hud-top">
      <span class="hint">Drag to orbit · scroll or pinch to zoom</span>
      <button class="ghost-btn" id="resetView" type="button">Reset view</button>
    </div>
    <div class="hud hud-bottom">
      <div class="legend" id="legend"></div>
      <div class="scale" aria-hidden="true"><span id="scaleTxt">5 µm</span><div class="bar" id="scaleBar"></div></div>
    </div>
    <div class="fade" id="fade"><span id="fadeTxt">Zooming in</span></div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-inner">
      <header class="brand">
        <span class="eyebrow">From your plate to ATP</span>
        <h1>Inside the <em>Cell City</em></h1>
      </header>
      <nav class="rail" id="rail" aria-label="Chapters"></nav>
      <div class="rail-name" id="railName"></div>
      <article class="chapter" id="chapter" aria-live="polite"></article>
      <div class="pager">
        <button class="btn prev" id="prevBtn" type="button"><small>Previous</small><span id="prevName"></span></button>
        <button class="btn next" id="nextBtn" type="button"><small>Next</small><span id="nextName"></span></button>
      </div>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================================================================
   Chapter content
   ================================================================ */
const m = (txt, c) => `<span class="m" style="--c:var(--${c})">${txt}</span>`;

const ORGANELLES = [
  { id: 'nucleus', name: 'Nucleus', role: 'Head office & archive', c: 'nucleus',
    text: 'Holds the blueprints: about 2 metres of DNA folded into a sphere roughly 6 µm across. Orders go out as messenger RNA through thousands of nuclear pores.' },
  { id: 'er', name: 'Rough ER', role: 'Production line', c: 'membrane',
    text: 'A maze of membrane sheets studded with ribosomes. Proteins meant for export or for membranes are built and folded here.' },
  { id: 'golgi', name: 'Golgi apparatus', role: 'Shipping & packaging', c: 'golgi',
    text: 'A stack of flattened sacs that trims, tags and sorts proteins, then buds them off in vesicles addressed to their destination.' },
  { id: 'mito', name: 'Mitochondria', role: 'Power plants', c: 'mito',
    text: 'Where the Krebs cycle and the electron transport chain run. A liver cell has around a thousand or more; heart muscle is packed with them.' },
  { id: 'lyso', name: 'Lysosomes', role: 'Recycling centre', c: 'lyso',
    text: 'Acidic sacs (pH about 4.5 to 5) full of digestive enzymes that break down worn-out parts and anything the cell swallows.' },
  { id: 'ribo', name: 'Ribosomes', role: 'Assembly benches', c: 'co2',
    text: 'Molecular machines that read mRNA and link amino acids into proteins. Free ones in the cytosol make the cell’s own working proteins.' },
  { id: 'cyto', name: 'Cytoskeleton', role: 'Roads & rail', c: 'pyruvate',
    text: 'Microtubules and actin filaments hold the city’s shape. Motor proteins walk cargo along them like trains on tracks.' },
  { id: 'membrane', name: 'Plasma membrane', role: 'City wall & gates', c: 'glucose',
    text: 'A lipid bilayer only 5 to 10 nm thick. Transporters such as GLUT act as gates, so glucose only enters where a door is open.' },
];

const KN = [
  { name: 'Oxaloacetate', short: 'OAA', c: 4 },
  { name: 'Citrate', short: 'CIT', c: 6 },
  { name: 'Isocitrate', short: 'ICT', c: 6 },
  { name: 'α-Ketoglutarate', short: 'αKG', c: 5 },
  { name: 'Succinyl-CoA', short: 'SCoA', c: 4 },
  { name: 'Succinate', short: 'SUC', c: 4 },
  { name: 'Fumarate', short: 'FUM', c: 4 },
  { name: 'Malate', short: 'MAL', c: 4 },
];
const KSTEPS = [
  { enzyme: 'Citrate synthase', extraIn: 'Acetyl-CoA', extraInC: 2, out: [],
    note: 'The 2-carbon acetyl group joins 4-carbon oxaloacetate to make citrate. Coenzyme A is set free to go and collect another acetyl group.' },
  { enzyme: 'Aconitase', out: [],
    note: 'A hydroxyl group is moved, turning citrate into its isomer isocitrate. Nothing is released; this sets up the first oxidation.' },
  { enzyme: 'Isocitrate dehydrogenase', out: ['NADH', 'CO2'],
    note: 'First oxidation. One carbon leaves as CO₂ and a pair of electrons is loaded onto NAD⁺. This is the cycle’s main control point.' },
  { enzyme: 'α-Ketoglutarate dehydrogenase', out: ['NADH', 'CO2'],
    note: 'A second carbon leaves as CO₂ and another NADH is made. Two carbons in, two carbons out: the books now balance.' },
  { enzyme: 'Succinyl-CoA synthetase', out: ['GTP'],
    note: 'The energy in the thioester bond makes one GTP (ATP in some tissues). This is the only energy currency the cycle makes directly.' },
  { enzyme: 'Succinate dehydrogenase', out: ['FADH2'],
    note: 'This enzyme is built into the inner membrane and doubles as Complex II of the electron transport chain. It loads electrons onto FAD.' },
  { enzyme: 'Fumarase', out: [],
    note: 'Water is added across the double bond of fumarate, giving malate.' },
  { enzyme: 'Malate dehydrogenase', out: ['NADH'],
    note: 'The third NADH. Oxaloacetate is regenerated, ready to grab the next acetyl group, which is what makes this a cycle.' },
];
const OUT = {
  NADH: { label: 'NADH', c: 'nadh' }, FADH2: { label: 'FADH₂', c: 'fadh' }, GTP: { label: 'GTP', c: 'atp' },
  CO2: { label: 'CO₂', c: 'co2' }, ATP: { label: 'ATP', c: 'atp' }, H2O: { label: 'H₂O', c: 'electron' },
};

const CHAPTERS = [
  {
    id: 'cell', short: 'Cell city', where: 'The whole cell · about 20 µm across',
    title: 'A city the size of a speck of dust',
    legend: [['nucleus', 'Nucleus'], ['membrane', 'Membrane & ER'], ['golgi', 'Golgi'], ['mito', 'Mitochondria'], ['lyso', 'Lysosomes']],
    html: () => `
      <p class="lede">Every one of your roughly 30 trillion cells runs like a small industrial city. It has an archive, production lines, a shipping depot, recycling and, most important for this story, power plants.</p>
      <p class="muted">Pick a district to fly to it. Then follow a single glucose molecule from your last meal all the way to ATP, the energy currency every district spends.</p>
      <div class="orgs" id="orgs">${ORGANELLES.map(o => `
        <button class="org" type="button" data-id="${o.id}" style="--c:var(--${o.c})"><i></i><span><b>${o.name}</b><small>${o.role}</small></span></button>`).join('')}
      </div>
      <div class="org-card" id="orgCard"><h3>Choose a district</h3><p>Each label in the 3D view is clickable too.</p></div>`,
  },
  {
    id: 'fuel', short: 'Fuel', where: 'Digestion & the cell surface',
    title: 'Three fuel lines, one destination',
    legend: [['glucose', 'Glucose (from carbs)'], ['fat', 'Fatty acids (from fats)'], ['amino', 'Amino acids (from protein)']],
    html: () => `
      <p class="lede">Carbohydrates really are broken down to glucose. Fats and proteins take their own roads, though, and merge into the same pathway further downstream. The shared destination is ATP.</p>
      <div class="routes">
        <div class="route">
          <h3>${m('Carbohydrates', 'glucose')}</h3>
          <div class="path">starch, sugar → glucose → glycolysis → pyruvate → acetyl-CoA</div>
          <p>The main road, and the one this explainer follows. Your brain runs almost entirely on it.</p>
        </div>
        <div class="route">
          <h3>${m('Fats', 'fat')}</h3>

    const a = camera.aspect;
    const off = pose.pos.clone().sub(pose.target);
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const need = pose.w ? pose.w / (tanH * Math.min(a, 1.6)) : 0;
    const len = Math.max(off.length(), need);
    return { pos: pose.target.clone().add(off.setLength(len)), target: pose.target.clone() };
  }

      return;
    }
  }
  function kEmit() {
    const st = KSTEPS[K.step];
    setToken(KN[(K.step + 1) % 8].c);

    st.out.forEach((kind, i) => {

  const protonGeo = new THREE.SphereGeometry(0.2, 10, 8);

  function makeProton() { const g = new THREE.Group(); g.add(new THREE.Mesh(protonGeo, protonMat)); g.add(glow(C.proton, 0.9)); return g; }
  B.etc = {
    enter() { this.next = now + 0.3; this.free = []; this.nextUse = now + 1; this.used = 0; this.spin = 0.6; this.n = 0; },
    pump(x, n) {
      if (this.free.length > 70) return;
      for (let i = 0; i < n; i++) {
        const p = makeProton();
        const a = new V3(x + rr(-1, 1), -3.6, rr(-1, 1));
        travel(etcGroup, p, [a, new V3(x + rr(-.5, .5), 0, rr(-.5, .5)), new V3(x + rr(-2, 2), 3.4, rr(-2, 2))], 1.5, {

    },
    electrons(fromFAD) {

      const lb = textSprite('2e⁻', C.electron, 0.5); lb.position.y = 0.6; e.add(lb);
      const carrier = new THREE.Color(fromFAD ? C.fadh : C.nadh);
      const dropFrom = fromFAD ? new V3(X.II - 2, -7.5, 2.5) : new V3(X.I - 4.5, -8, 2.5);
      const dropAt = fromFAD ? new V3(X.II, -3.4, 0.6) : new V3(X.I - 2, -5.8, 0.6);
      emit(etcGroup, fromFAD ? 'FADH2' : 'NADH', dropFrom, dropAt, 1.3);
      const q = new THREE.Mesh(atomGeo, atomMat(C.fadh)); q.scale.setScalar(0.34);
      const cyt = new THREE.Mesh(atomGeo, atomMat(C.mito)); cyt.scale.setScalar(0.5);
      const seg1 = fromFAD ? [dropAt, new V3(X.II, -1.2, 0.4), new V3(X.II + 0.6, 0, 0.8)] : [dropAt, new V3(X.I - 2, -3, 0.5), new V3(X.I, -0.2, 0.6), new V3(X.I + 3.4, 0, 0.8)];
      setTimeout(() => {
        if (stageId !== 'etc') return;
        travel(etcGroup, e, seg1, fromFAD ? 1.2 : 1.6, {
          keep: true,
          onDone: () => {
            if (!fromFAD) this.pump(X.I, 4);
            e.add(q);
            travel(etcGroup, e, [e.position.clone(), new V3(-6, 0, 1.4), new V3(X.III - 1.2, 0, 0.8), new V3(X.III, 0.3, 0)], 1.5, {
              keep: true,
              onDone: () => {
                e.remove(q); this.pump(X.III, 4); e.add(cyt);
                travel(etcGroup, e, [e.position.clone(), new V3(X.III, 2.9, 0.5), new V3(0.5, 3.4, 0.8), new V3(X.IV, 2.7, 0.5), new V3(X.IV, 0.2, 0)], 1.8, {
                  keep: true,
                  onDone: () => {
                    e.remove(cyt); this.pump(X.IV, 2);
                    travel(etcGroup, e, [e.position.clone(), new V3(X.IV + 0.4, -2.6, 0.4)], 0.8, {
                      shrinkEnd: true,
                      onDone: () => emit(etcGroup, 'H2O', new V3(X.IV + 0.4, -2.8, 0.4), new V3(X.IV + 2.4, -7.5, 2.2), 2.4),
                    });
                  },
                });
              },
            });
          },
        });
      }, 1250);
    },
    tick(t, dt) {
      if (t > this.next) {
        this.n++;
        this.electrons(this.n % 3 === 0);
        this.next = t + 2.4;
      }
      this.free.forEach(f => {
        f.v.add(new V3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(dt * 2)).clampLength(0, 1.4);
        const p = f.o.position; p.addScaledVector(f.v, dt);

        if (p.z < -4.5 || p.z > 4.5) f.v.z *= -1;
        p.y = Math.min(6.5, Math.max(2.2, p.y));
      });
      if (t > this.nextUse && this.free.length > 3) {
        this.nextUse = t + 0.3;
        const target = new V3(X.SYN + 1.3, 2.4, 0);
        let bi = 0; this.free.forEach((f, i) => { if (f.o.position.distanceTo(target) < this.free[bi].o.position.distanceTo(target)) bi = i; });
        const f = this.free.splice(bi, 1)[0];
        const a = rnd() * Math.PI * 2;
        travel(etcGroup, f.o, [f.o.position.clone(), new V3(X.SYN + 1.9, 2.6, 0.4), new V3(X.SYN + Math.cos(a) * 1.3, 0, Math.sin(a) * 1.3), new V3(X.SYN + 1.8, -2.4, 1.2)], 1.6, {
          shrinkEnd: true,
          onDone: () => {
            this.used++; this.spin = Math.min(6, this.spin + 0.7);
            if (this.used % 3 === 0) emit(etcGroup, 'ATP', new V3(X.SYN, -6.2, 1.2), new V3(X.SYN + rr(-3, 3), -10, rr(1, 4)), 2.6);
          },
        });
      }
      this.spin += (0.6 - this.spin) * Math.min(1, dt * 0.6);
      rotor.rotation.y += this.spin * dt;
    },
    exit() { (this.free || []).forEach(f => disposeObj(f.o)); this.free = []; },
  };

  /* ================= chapter changes ================= */
  setupPanel((id, prevId) => {
    if (B[stageId] && B[stageId].exit) B[stageId].exit();
    clearAgents();
    stageId = id;
    labels.forEach(l => { l.el.classList.remove('on'); });
    goStage(id, !started);
    if (B[id] && B[id].enter) B[id].enter();
    started = true;
  });
  let started = false;

  /* ================= resize ================= */
  function resize() {
    const r = stageEl.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();

  const initial = CHAPTERS.findIndex(c => c.id === location.hash.slice(1));
  showChapter(initial >= 0 ? initial : 0);

  /* ================= frame loop ================= */
  const scaleTxt = $('#scaleTxt'), scaleBar = $('#scaleBar'), fadeEl = $('#fade');
  const clock = new THREE.Clock();
  const tmp = new V3();
  let lastScaleUpdate = 0;
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, clock.getDelta());
    dtG = dt; now += dt;

    if (tween) {
      const u = Math.min(1, (now - tween.start) / tween.dur), e = ease.inOut(u);
      camera.position.lerpVectors(tween.p0, tween.p1, e);
      controls.target.lerpVectors(tween.t0, tween.t1, e);
      if (u >= 1) tween = null;
    }
    controls.update();

    // ambient life
    const amb = reduceMotion ? 0.2 : 1;
    if (cellGroup.visible) {
      mitos.forEach((mm, i) => {
        const d = mm.userData;
        mm.position.set(d.base.x + Math.sin(now * 0.4 + d.ph) * 0.12 * amb, d.base.y + Math.cos(now * 0.35 + d.ph) * 0.12 * amb, d.base.z);
        mm.rotation.y += dt * 0.08 * amb;
        const mat = mm.children[0].material;
        mat.emissiveIntensity = stageId === 'tally' ? 0.55 + Math.sin(now * 3 + i) * 0.25 : 0.35;
      });
      lysos.forEach(l => { const d = l.userData; l.position.set(d.base.x + Math.sin(now * 0.3 + d.ph) * 0.2 * amb, d.base.y + Math.sin(now * 0.25 + d.ph * 2) * 0.2 * amb, d.base.z + Math.cos(now * 0.3 + d.ph) * 0.2 * amb); });
      nucleus.rotation.y += dt * 0.02 * amb;
    }
    if (mitoGroup.visible) {
      cristae.forEach(c => { c.material.opacity += (cristaeTarget - c.material.opacity) * Math.min(1, dt * 3); });
    }

    const b = B[stageId];
    if (b && b.tick) b.tick(now, dt);
    const list = agents; agents = [];
    for (const a of list) if (a.update(now)) agents.push(a);

    renderer.render(scene, camera);

    // labels
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const fading = fadeEl.classList.contains('on');
    for (const l of labels) {
      const show = !fading && l.stages.includes(stageId) && l.parent.visible !== false && GROUPS[currentGroup] && isIn(l.parent, GROUPS[currentGroup]);
      if (!show) { if (!l.el.hidden) l.el.hidden = true; continue; }
      tmp.copy(l.anchor).applyMatrix4(l.parent.matrixWorld).project(camera);
      if (tmp.z > 1 || tmp.x < -1.2 || tmp.x > 1.2 || tmp.y < -1.2 || tmp.y > 1.2) { l.el.hidden = true; continue; }
      l.el.hidden = false;
      l.el.style.transform = `translate(${((tmp.x + 1) / 2 * w).toFixed(1)}px, ${((1 - tmp.y) / 2 * h).toFixed(1)}px) translate(-50%, -50%)`;
    }

    // scale bar
    if (now - lastScaleUpdate > 0.1) {
      lastScaleUpdate = now;
      const dist = camera.position.distanceTo(controls.target);
      const pxPerUnit = (h / 2) / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist);
      const pxPerNm = pxPerUnit * UNITS_PER_NM[currentGroup];
      const want = 90 / pxPerNm;
      const pow = Math.pow(10, Math.floor(Math.log10(want)));
      const nice = [1, 2, 5, 10].map(v => v * pow).reduce((bst, v) => Math.abs(v * pxPerNm - 90) < Math.abs(bst * pxPerNm - 90) ? v : bst);
      scaleBar.style.width = (nice * pxPerNm).toFixed(0) + 'px';
      scaleTxt.textContent = nice >= 1000 ? `${+(nice / 1000).toPrecision(3)} µm` : `${+nice.toPrecision(3)} nm`;
    }
  }
  function isIn(obj, root) { let o = obj; while (o) { if (o === root) return true; o = o.parent; } return false; }
  requestAnimationFrame(frame);
}

if (renderer) init();
else buildPanelOnly();
})();
</script>
